<body data-elab-page="pdf">
<div data-elab-nav="pdf"></div>
<main class="wrap">
  <header class="eb-page-header"><h1>PDF 자료관리</h1></header>
  <div class="grid">
    <section class="panel">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="upload">PDF 업로드<input id="file" type="file" accept="application/pdf" multiple></label><label class="upload">폴더 전체 업로드<input id="folder" type="file" accept=".pdf,image/*" webkitdirectory directory multiple></label></div>
      <label class="upload" style="margin-top:8px;background:#fff">정답 PNG 폴더 지정<input id="answerPngFolder" type="file" accept="image/png" webkitdirectory directory multiple></label>
      <button id="reviewPdf" type="button" class="upload" style="width:100%;margin-top:8px;background:#1e3a56;color:#fff;border-color:#1e3a56">선택 PDF 렌더링 검수</button>
      <p style="margin:10px 2px 0;color:var(--eb-text-muted);font-size:12px;line-height:1.55">업로드한 PDF는 이곳의 <b>PDF 렌더링 검수</b>에서 완료 처리한 뒤 문장구조 연습·문법학습·개별문제·실전연습에 반영됩니다. 삭제와 재검수 상태도 이곳을 기준으로 모든 메뉴에 적용됩니다.</p>
      <div id="list" class="list"></div>
    </section>
    <section class="panel">
      <div id="empty" class="empty">PDF를 업로드하거나 저장된 자료를 선택하세요.</div>
      <form id="form" hidden>
        <div class="form-grid">
          <div class="field"><label for="examName">시험명</label><input id="examName" required></div>
          <div class="field"><label for="grade">학년</label><select id="grade"><option value="">선택</option><option>고1</option><option>고2</option><option>고3</option></select></div>
          <div class="field"><label for="year">연도</label><input id="year" type="number" min="2000" max="2100"></div>
          <div class="field"><label for="month">월</label><select id="month"><option value="">선택</option></select></div>
        </div>
        <div class="range" style="margin-top:12px">
          <div class="field"><label for="startNum">시작 문항</label><input id="startNum" type="number" min="1"></div>
          <div class="field"><label for="endNum">끝 문항</label><input id="endNum" type="number" min="1"></div>
        </div>
        <div class="field" style="margin-top:12px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px"><label style="margin:0">정답</label><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end"><label class="btn sub" style="padding:7px 11px;font-size:12px">정답 이미지 자동인식<input id="answerImage" type="file" accept="image/*" hidden></label><button id="openAnswerPng" class="btn sub" type="button" style="padding:7px 11px;font-size:12px">정답 PNG파일</button></div></div><div class="answer-quick"><input id="quickAnswers" inputmode="numeric" placeholder="18번부터 정답만 연속 입력 (예: 12345...)"><button id="applyQuickAnswers" class="btn sub" type="button">일괄 입력</button></div><div id="answerGrid" class="answer-grid"></div><p id="answerHelp" class="answer-help"></p></div>
        <div class="actions"><button class="btn" type="submit">정보 저장</button><button id="use" class="btn sub" type="button">이 PDF 사용</button><button id="remove" class="btn danger" type="button">삭제</button></div>
        <div id="status" class="status"></div>
        <canvas id="preview" class="preview"></canvas>
      </form>
    </section>
  </div>
</main>
<section id="answerPngModal" class="answer-png-modal" hidden role="dialog" aria-modal="false" aria-labelledby="answerPngModalName">
  <div id="answerPngDialog" class="answer-png-dialog">
    <header id="answerPngHead" class="answer-png-head" title="드래그해서 이동 · 오른쪽 아래 모서리에서 크기 조절"><div id="answerPngModalName" class="answer-png-name"></div><a id="answerPngDownload" download>PNG 다운로드</a><button id="answerPngClose" type="button">닫기</button></header>
    <div id="answerPngBody" class="answer-png-body"><img id="answerPngPreview" alt="정답 PNG 미리보기"></div>
  </div>
</section>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);let selected=null;
for(let m=1;m<=12;m++)$('#month').insertAdjacentHTML('beforeend',`<option value="${m}">${m}월</option>`);$('#month').insertAdjacentHTML('beforeend','<option value="99">수능</option>');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function collectAnswers(){const out={};document.querySelectorAll('[data-answer-num]').forEach(input=>{const value=Number(input.value);if(value>=1&&value<=5)out[input.dataset.answerNum]=value});return out}
function mergeVisibleAnswers(base){const out={...(base||{})};document.querySelectorAll('[data-answer-num]').forEach(input=>{const key=String(input.dataset.answerNum),value=Number(input.value);if(value>=1&&value<=5)out[key]=value;else delete out[key]});return out}
function renderAnswerGrid(values){const start=Number($('#startNum').value)||18,end=Number($('#endNum').value)||45,answers=values||collectAnswers(),grid=$('#answerGrid');grid.innerHTML='';if(end<start)return updateAnswerHelp();for(let n=start;n<=end;n++)grid.insertAdjacentHTML('beforeend',`<div class="answer-cell"><label for="answer-${n}">${n}번</label><input id="answer-${n}" data-answer-num="${n}" value="${answers[n]||''}" inputmode="numeric" maxlength="1" pattern="[1-5]" aria-label="${n}번 정답"></div>`);grid.querySelectorAll('[data-answer-num]').forEach((input,index,list)=>input.addEventListener('input',()=>{input.value=(input.value.match(/[1-5]/)||[])[0]||'';updateAnswerHelp();if(input.value&&list[index+1])list[index+1].focus()}));updateAnswerHelp()}
function updateAnswerHelp(){const start=Number($('#startNum').value)||0,end=Number($('#endNum').value)||0,count=Object.keys(collectAnswers()).length,total=start&&end>=start?end-start+1:0;$('#answerHelp').textContent=total?`문항번호 ${start}~${end}번 자동 생성 · 정답 ${count}/${total}개 입력`:'문항 범위를 확인해주세요.'}
const ORDER_KEY='elab.pdfTree.order.v1';let draggedNode=null,reviewSelection=new Set();
function loadOrder(){try{return JSON.parse(localStorage.getItem(ORDER_KEY))||{}}catch(e){return{}}}
function saveOrder(order){localStorage.setItem(ORDER_KEY,JSON.stringify(order))}
function ordered(keys,parent){const saved=loadOrder()[parent]||[];return [...saved.filter(key=>keys.includes(key)),...keys.filter(key=>!saved.includes(key))]}
function setOrder(parent,keys){const order=loadOrder();order[parent]=keys;saveOrder(order)}
function actions(){return`<span class="tree-actions"><button type="button" data-shift="-1" title="위로 이동" aria-label="위로 이동">↑</button><button type="button" data-shift="1" title="아래로 이동" aria-label="아래로 이동">↓</button></span>`}
function pdfButton(r,current,parent){const id='p:'+r.id,renderApproved=ElabPdfLibrary.isReviewed(r),answerApproved=r.answerReviewStatus==='approved',answerCount=Object.keys(r.answers||{}).length;return`<div class="pdf-node tree-node" draggable="true" data-tree-id="${esc(id)}" data-parent="${esc(parent)}" data-kind="pdf" data-record-id="${esc(r.id)}"><input type="checkbox" data-review-file="${esc(r.id)}" ${reviewSelection.has(r.id)?'checked':''} aria-label="${esc(r.examName||r.title||r.name)} 검수 선택"><button class="item ${r.id===current?'active':''}" data-id="${r.id}"><b>📄 ${esc(r.examName||r.title||r.name)}</b><span>${esc(r.name)} · ${renderApproved?'✅ 렌더링 검수 완료':'⏳ 렌더링 검수 대기'} · ${answerApproved?`✅ 정답 검수 완료 (${answerCount}개)`:'⏳ 정답 검수 대기'}</span></button>${actions()}</div>`}
function folder(label,count,content,open,id,parent,kind,attrs=''){return`<details class="tree-node" draggable="true" data-tree-id="${esc(id)}" data-parent="${esc(parent)}" data-kind="${esc(kind)}" ${attrs} ${open?'open':''}><summary><input type="checkbox" data-review-group aria-label="${esc(label)} 폴더 전체 검수 선택"><span class="folder-icon">📁</span><span>${esc(label)}</span><span class="count">${count}</span>${actions()}</summary>${content}</details>`}
function moveSibling(node,delta){const parent=node.dataset.parent,siblings=[...document.querySelectorAll(`.tree-node[data-parent="${CSS.escape(parent)}"]`)],index=siblings.indexOf(node),next=index+delta;if(index<0||next<0||next>=siblings.length)return;const ids=siblings.map(x=>x.dataset.treeId);[ids[index],ids[next]]=[ids[next],ids[index]];setOrder(parent,ids);renderList()}
function bindTree(){
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openRecord(b.dataset.id));
  const refreshReviewChecks=()=>{document.querySelectorAll('[data-review-group]').forEach(group=>{const inputs=[...group.closest('details').querySelectorAll('[data-review-file]')],checked=inputs.filter(input=>input.checked).length;group.checked=!!inputs.length&&checked===inputs.length;group.indeterminate=checked>0&&checked<inputs.length});$('#reviewPdf').textContent=reviewSelection.size?`${reviewSelection.size}개 PDF 렌더링 검수`:'선택 PDF 렌더링 검수'};
  document.querySelectorAll('[data-review-file]').forEach(input=>input.onchange=event=>{event.stopPropagation();if(input.checked)reviewSelection.add(input.dataset.reviewFile);else reviewSelection.delete(input.dataset.reviewFile);refreshReviewChecks()});
  document.querySelectorAll('[data-review-group]').forEach(group=>group.onchange=event=>{event.stopPropagation();const inputs=group.closest('details').querySelectorAll('[data-review-file]');inputs.forEach(input=>{input.checked=group.checked;if(group.checked)reviewSelection.add(input.dataset.reviewFile);else reviewSelection.delete(input.dataset.reviewFile)});refreshReviewChecks()});
  document.querySelectorAll('[data-review-file],[data-review-group]').forEach(input=>input.onclick=event=>event.stopPropagation());
  document.querySelectorAll('[data-shift]').forEach(button=>button.onclick=e=>{e.preventDefault();e.stopPropagation();moveSibling(button.closest('.tree-node'),Number(button.dataset.shift))});
  document.querySelectorAll('.tree-node').forEach(node=>{
    node.addEventListener('dragstart',e=>{if(e.target.closest('.tree-actions')){e.preventDefault();return}draggedNode=node;node.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',node.dataset.treeId)});
    node.addEventListener('dragend',()=>{node.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));draggedNode=null});
    node.addEventListener('dragover',e=>{if(!draggedNode||draggedNode===node)return;const sameParent=draggedNode.dataset.parent===node.dataset.parent;const pdfToYear=draggedNode.dataset.kind==='pdf'&&node.dataset.kind==='year';if(!sameParent&&!pdfToYear)return;e.preventDefault();e.stopPropagation();node.classList.add('drag-over');e.dataTransfer.dropEffect='move'});
    node.addEventListener('dragleave',e=>{if(!node.contains(e.relatedTarget))node.classList.remove('drag-over')});
    node.addEventListener('drop',async e=>{if(!draggedNode||draggedNode===node)return;e.preventDefault();e.stopPropagation();node.classList.remove('drag-over');if(draggedNode.dataset.parent===node.dataset.parent){const siblings=[...document.querySelectorAll(`.tree-node[data-parent="${CSS.escape(node.dataset.parent)}"]`)],ids=siblings.map(x=>x.dataset.treeId).filter(id=>id!==draggedNode.dataset.treeId),at=ids.indexOf(node.dataset.treeId);ids.splice(at,0,draggedNode.dataset.treeId);setOrder(node.dataset.parent,ids);await renderList();return}if(draggedNode.dataset.kind==='pdf'&&node.dataset.kind==='year'){await ElabPdfLibrary.updateById(draggedNode.dataset.recordId,{grade:node.dataset.grade==='미분류'?'':node.dataset.grade,year:node.dataset.year==='미분류'?'':Number(node.dataset.year)});await renderList()}});
  });
  refreshReviewChecks();
}
async function renderList(){
  const rows=await ElabPdfLibrary.list(),current=ElabPdfLibrary.currentId();
  if(!rows.length){$('#list').innerHTML='<div class="empty">저장된 PDF가 없습니다.</div>';return}
  const grades={};
  rows.forEach(r=>{const g=r.grade||'미분류',y=r.year?String(r.year):'미분류';if(!grades[g])grades[g]={};if(!grades[g][y])grades[g][y]=[];grades[g][y].push(r)});

async function importFiles(fileList){const selected=[...fileList],files=selected.filter(file=>file.type==='application/pdf'||/\.pdf$/i.test(file.name)),images=selected.filter(file=>/^image\//.test(file.type)||/\.(png|jpe?g|webp|bmp)$/i.test(file.name));if(!files.length){alert('선택한 폴더에 PDF 파일이 없습니다.');return}let last=null;const imported=[];for(let i=0;i<files.length;i++){const file=files[i];last=await ElabPdfLibrary.saveFile(file,metadataFromPath(file));imported.push({file,record:last,dir:fileDir(file)});if(i===0){$('#empty').hidden=true;$('#form').hidden=false}$('#status').textContent=`PDF 저장 중 ${i+1}/${files.length} · ${file.webkitRelativePath||file.name}`;await new Promise(resolve=>setTimeout(resolve,0))}let answerFiles=0,answerCount=0;for(let i=0;i<images.length;i++){const image=images[i],sameDir=imported.filter(x=>x.dir===fileDir(image));let target=sameDir.length===1?sameDir[0]:null;if(!target&&sameDir.length>1){const imageKey=matchName(image.name);const matches=sameDir.filter(x=>{const pdfKey=matchName(x.file.name);return imageKey&&pdfKey&&(imageKey.includes(pdfKey)||pdfKey.includes(imageKey))});if(matches.length===1)target=matches[0]}if(!target)continue;target.record=await saveAnswerPng(target.record,image);answerFiles++;const start=Number(target.record.startNum)||18,end=Number(target.record.endNum)||45;let recognized=knownAnswers(image.name,start,end);if(recognized){$('#status').textContent=`검증된 정답 연결 중 ${i+1}/${images.length} · ${image.name}`}else{if(!window.Tesseract&&typeof window.OCRAD!=='function')continue;$('#status').textContent=`정답 이미지 인식 중 ${i+1}/${images.length} · ${image.name}`;recognized=await recognizeAnswers(image,start,end,progress=>$('#status').textContent=`정답 이미지 인식 ${progress}% · ${image.name}`)}const count=Object.keys(recognized).length;if(count){target.record=await ElabPdfLibrary.updateById(target.record.id,{answers:{...(target.record.answers||{}),...recognized}});answerCount+=count}}await renderList();if(last)await openRecord(last.id);$('#status').textContent=`PDF ${files.length}개 저장 · 정답 이미지 ${answerFiles}개 연결 · 정답 ${answerCount}개 입력 완료`}
$('#file').onchange=async function(){try{await importFiles(this.files)}catch(e){alert(e.message||'PDF를 저장하지 못했습니다.')}finally{this.value=''}};
$('#folder').onchange=async function(){try{await importFiles(this.files)}catch(e){alert(e.message||'폴더의 PDF를 저장하지 못했습니다.')}finally{this.value=''}};
$('#answerPngFolder').onchange=async function(){try{await linkAnswerPngFolder(this.files)}catch(e){console.error(e);alert(e.message||'정답 PNG 폴더를 연결하지 못했습니다.')}finally{this.value=''}};
$('#reviewPdf').onclick=reviewSelectedPdf;
$('#answerImage').onchange=async function(){const file=this.files[0];this.value='';if(!file||!selected)return;const start=Number($('#startNum').value)||18,end=Number($('#endNum').value)||45;$('#status').textContent='정답 이미지를 PNG로 저장하는 중...';try{selected=await saveAnswerPng(selected,file);syncAnswerPngButton();const recognized=await recognizeAnswers(file,start,end,progress=>$('#status').textContent=`정답 이미지 인식 중 ${progress}%`),count=Object.keys(recognized).length;selected.answers={...mergeVisibleAnswers(selected.answers),...recognized};renderAnswerGrid(selected.answers);$('#status').textContent=count?`정답 PNG파일을 저장하고 정답 ${count}/${end-start+1}개를 자동 입력했습니다. 저장 전에 확인해주세요.`:'정답 PNG파일은 저장했지만 정답 숫자를 읽지 못했습니다. 표 형식 감지 또는 OCR 처리 문제입니다.'}catch(e){console.error(e);$('#status').textContent=`정답 이미지 처리 실패: ${e&&e.message?e.message:'알 수 없는 오류'}`}};
$('#openAnswerPng').onclick=async function(){if(!selected){$('#status').textContent='먼저 왼쪽에서 모의고사를 선택해주세요.';return}if(!hasAnswerPng()){const message='이 모의고사에는 저장된 정답 PNG파일이 없습니다. 「정답 이미지 자동인식」을 눌러 정답 이미지를 한 번 등록해주세요.';$('#status').textContent=message;alert(message);return}const fileName=selected.answerPngSourceName||selected.answerPngName||'정답.png',storedBlob=selected.answerPngBlob,blob=storedBlob instanceof Blob&&/^image\//i.test(storedBlob.type||'')?storedBlob:new Blob([storedBlob],{type:'image/png'});$('#answerPngModalName').textContent=fileName;$('#answerPngBody').innerHTML='<div class="answer-png-error">PNG파일을 불러오는 중...</div>';$('#answerPngModal').hidden=false;try{const dataUrl=await blobDataUrl(blob);if(!dataUrl||dataUrl.indexOf('data:image/')!==0)throw new Error('저장된 파일이 PNG 이미지 형식이 아닙니다.');$('#answerPngBody').innerHTML='<img id="answerPngPreview" alt="정답 PNG 미리보기">';$('#answerPngPreview').src=dataUrl;$('#answerPngDownload').href=dataUrl;$('#answerPngDownload').download=fileName;$('#status').textContent=`${fileName}을 팝업에서 열었습니다.`}catch(error){console.error(error);$('#answerPngBody').innerHTML=`<div class="answer-png-error">${esc(error&&error.message?error.message:'PNG파일을 표시하지 못했습니다.')}</div>`;$('#status').textContent='정답 PNG파일을 표시하지 못했습니다. PNG파일을 다시 등록해주세요.'}};
$('#answerPngClose').onclick=closeAnswerPngModal;
$('#answerPngModal').onclick=event=>{if(event.target===$('#answerPngModal'))closeAnswerPngModal()};
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#answerPngModal').hidden)closeAnswerPngModal()});
enableAnswerPngDrag();
$('#form').onsubmit=async function(e){e.preventDefault();if(!selected)return;const startNum=Number($('#startNum').value)||'',endNum=Number($('#endNum').value)||'';if(!startNum)return $('#status').textContent='시작 문항을 입력해주세요.';const answers=mergeVisibleAnswers(selected.answers),answerCount=Object.keys(answers).length,patch={examName:$('#examName').value.trim(),title:$('#examName').value.trim(),grade:$('#grade').value,year:Number($('#year').value)||'',month:Number($('#month').value)||'',startNum,endNum,answers,answerReviewStatus:'approved',answerReviewedAt:Date.now()};selected=await ElabPdfLibrary.updateById(selected.id,patch);$('#status').textContent=`정보 저장 완료 · 정답 검수 완료 (${answerCount}개) · 기존 정답은 계속 유지됩니다.`;await renderList()};
$('#use').onclick=async function(){if(!selected)return;ElabPdfLibrary.select(selected.id);$('#status').textContent='네 학습 메뉴에서 사용할 PDF로 선택했습니다.';await renderList()};
$('#remove').onclick=async function(){if(!selected||!confirm('이 PDF를 삭제할까요?'))return;await ElabPdfLibrary.remove(selected.id);selected=null;syncAnswerPngButton();$('#form').hidden=true;$('#empty').hidden=false;await renderList()};
$('#applyQuickAnswers').onclick=()=>{const start=Number($('#startNum').value)||18,end=Number($('#endNum').value)||45,digits=String($('#quickAnswers').value||'').match(/[1-5]/g)||[],needed=end-start+1;if(digits.length!==needed){$('#status').textContent=`정답은 ${needed}개가 필요합니다. 현재 ${digits.length}개 입력했습니다.`;return}const answers=mergeVisibleAnswers(selected&&selected.answers);digits.forEach((digit,index)=>answers[start+index]=Number(digit));if(selected)selected.answers=answers;renderAnswerGrid(answers);$('#status').textContent=`${start}~${end}번 정답 ${needed}개를 입력했습니다. 기존 범위의 정답도 유지됩니다.`};
async function applyGeneratedAnswersOnce(){const version='20260829-2',key='elab.pdfAnswers.appliedVersion';if(localStorage.getItem(key)===version)return;const rows=await ElabPdfLibrary.list();for(const row of rows){const answers=knownAnswers(row.name||row.examName,Number(row.startNum)||18,Number(row.endNum)||45);if(answers)await ElabPdfLibrary.updateById(row.id,{answers:{...(row.answers||{}),...answers}})}localStorage.setItem(key,version)}
applyGeneratedAnswersOnce().then(renderList).then(async()=>{const cur=ElabPdfLibrary.currentId();if(cur)openRecord(cur)});
['startNum','endNum'].forEach(id=>$('#'+id).addEventListener('change',()=>{if(selected)selected.answers=mergeVisibleAnswers(selected.answers);renderAnswerGrid(selected&&selected.answers||{})}));
</script>
