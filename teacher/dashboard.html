function syncStudents(){var selected=historySelect.value,options=[];document.querySelectorAll('#rows tr[data-id]').forEach(function(row){var name=row.querySelector('b');if(name)options.push({id:row.dataset.id,name:name.textContent})});historySelect.innerHTML='<option value="">학생을 선택하세요</option>'+options.map(function(x){return'<option value="'+hEsc(x.id)+'">'+hEsc(x.name)+'</option>'}).join('');if(options.some(function(x){return x.id===selected}))historySelect.value=selected}
new MutationObserver(syncStudents).observe(document.getElementById('rows'),{childList:true});syncStudents();
tabs.addEventListener('click',function(event){var button=event.target.closest('[data-view]');if(!button)return;tabs.querySelectorAll('.view-tab').forEach(function(x){x.classList.toggle('active',x===button)});var history=button.dataset.view==='history';learningView.hidden=history;historyView.hidden=!history;headerSubtitle.textContent=history?'학생별 과거 학습 결과를 수업일 기준으로 확인합니다.':'학생별 가장 최근 수업 후 숙제를 기준으로 보여줍니다.';if(history){showAll.click();syncStudents()}});
function historyUrl(cursor){var c=historyCfg();if(!c.token)return null;return(c.url||DEFAULT_HISTORY_URL)+'?action=listStudentAttemptHistoryV2&token='+encodeURIComponent(c.token)+'&student_id='+encodeURIComponent(historyStudent)+'&content_type='+encodeURIComponent(historyTrack)+'&limit=10&cursor='+encodeURIComponent(cursor||'0')}
function loadHistory(reset){if(!historyStudent)return;if(reset){historyGeneration++;historyGroups=[];unlinkedAttempts=[];historyCursor=null;openDates={};historyContent.innerHTML=''}var requestGeneration=historyGeneration,requestStudent=historyStudent,requestTrack=historyTrack,url=historyUrl(reset?'0':historyCursor);if(!url){historyStatus.className='empty error';historyStatus.textContent='교사용 토큰을 확인해주세요.';return}historyStatus.className='empty';historyStatus.textContent='결과이력을 불러오는 중입니다.';fetchJsonpObject(url).then(function(result){if(requestGeneration!==historyGeneration||requestStudent!==historyStudent||requestTrack!==historyTrack)return;if(!result||result.error)throw new Error(result&&result.error||'EMPTY_RESPONSE');historyGroups=historyGroups.concat(result.groups||[]);unlinkedAttempts=unlinkedAttempts.concat(result.unlinked_attempts||[]);historyCursor=result.next_cursor;historyStatus.hidden=true;renderHistory(result.student)}).catch(function(error){if(requestGeneration!==historyGeneration||requestStudent!==historyStudent||requestTrack!==historyTrack)return;historyStatus.hidden=false;historyStatus.className='empty error';historyStatus.textContent='결과이력을 불러오지 못했습니다: '+error.message})}
historySelect.addEventListener('change',function(){historyStudent=this.value;historyStatus.hidden=false;if(!historyStudent){historyGeneration++;historyGroups=[];unlinkedAttempts=[];historyCursor=null;openDates={};historyContent.innerHTML='';historyStatus.className='empty';historyStatus.textContent='학생을 선택하면 수업일별 결과를 불러옵니다.';return}loadHistory(true)});
historyTrackSelect.addEventListener('change',function(){historyTrack=this.value;if(historyStudent)loadHistory(true)});
document.getElementById('search').addEventListener('input',function(){setTimeout(syncStudents,0)});
function attemptRows(items){return'<table class="history-table"><thead><tr><th>영역</th><th>과제</th><th>결과</th><th>시간</th><th>상태</th></tr></thead><tbody>'+items.map(function(a){var repeat=a.content_type==='VOCAB'&&a.repetition_count?'<small class="muted">재시험 '+a.repetition_count+'회</small>':'';return'<tr'+(a.attempt_id?' class="history-attempt" data-history-attempt="'+hEsc(a.attempt_id)+'"':'')+'><td>'+hEsc(trackText(a.content_type))+'</td><td>'+hEsc(a.title||trackText(a.content_type))+'</td><td>'+hEsc(resultText(a))+repeat+'</td><td>'+hEsc(durationText(a.duration_ms))+'</td><td>'+hEsc(statusText(a.status))+'</td></tr>'}).join('')+'</tbody></table>'}
function assignmentResultRows(group){if(!Array.isArray(group.assignments))return group.attempts||[];var rows=[];group.assignments.forEach(function(assignment){if(assignment.attempts&&assignment.attempts.length){assignment.attempts.forEach(function(attempt){rows.push(attempt)})}else{rows.push({attempt_id:'',assignment_id:assignment.assignment_id,assignment_target_id:assignment.assignment_target_id,content_type:assignment.content_type,content_subtype:assignment.content_subtype,title:assignment.title,status:assignment.target_status||'NOT_STARTED',score:'',duration_ms:0,repetition_count:0,total_count:null,correct_count:null,accuracy:null})}});return rows}
function renderHistory(student){var groups=historyGroups.map(function(g){var key='day:'+g.lesson_date,expanded=!!openDates[key];return'<article class="history-group"><div class="history-group-head"><div><h3>'+hEsc(dayText(g.lesson_date))+'</h3><div class="muted">'+hEsc((g.tracks||[]).map(trackText).join(' · ')||'결과 없음')+'</div><div class="muted">'+Number(g.total_assignments||0)+'개 중 '+Number(g.completed_assignments||0)+'개 완료</div></div><button data-history-group="'+hEsc(key)+'">'+(expanded?'접기':'결과 보기')+'</button></div>'+(expanded?attemptRows(assignmentResultRows(g)):'')+'</article>'}).join('');var unlinked='';if(unlinkedAttempts.length){var key='unlinked',expanded=!!openDates[key];unlinked='<article class="history-group"><div class="history-group-head"><div><h3>수업일 미연결 결과</h3><div class="muted">완료일 또는 시작일 기준 · '+unlinkedAttempts.length+'건</div></div><button data-history-group="unlinked">'+(expanded?'접기':'결과 보기')+'</button></div>'+(expanded?attemptRows(unlinkedAttempts):'')+'</article>'}historyContent.innerHTML='<h2 class="history-head">'+hEsc((student&&student.name)||historySelect.options[historySelect.selectedIndex].text)+' · 결과이력</h2><div class="history-list">'+groups+unlinked+'</div>'+(historyCursor!=null?'<button class="more-history" id="moreHistory">이전 결과 더 보기</button>':'');historyContent.querySelectorAll('[data-history-group]').forEach(function(button){button.onclick=function(){openDates[button.dataset.historyGroup]=!openDates[button.dataset.historyGroup];renderHistory(student)}});historyContent.querySelectorAll('[data-history-attempt]').forEach(function(row){if(row.dataset.historyAttempt)row.onclick=function(){openHistoryAttempt(row.dataset.historyAttempt)}});var more=document.getElementById('moreHistory');if(more)more.onclick=function(){more.disabled=true;loadHistory(false)}}
function questionMetaText(q){var source=q.source||{},sourceText=[source.year,source.grade,source.month?source.month+'월':'',source.exam_name].filter(Boolean).join(' · '),categoryText=(q.categories||[]).map(function(category){return category.label}).join(', ');return[categoryText,sourceText,q.source_question_no?'문항 '+q.source_question_no:'',q.difficulty||'',q.elapsed_ms?durationText(q.elapsed_ms):''].filter(Boolean).join(' · ')}
function openHistoryAttempt(id){var c=historyCfg(),url=(c.url||DEFAULT_HISTORY_URL)+'?action=getAttemptDetailV2&attempt_id='+encodeURIComponent(id)+'&token='+encodeURIComponent(c.token);detailTitle.textContent='학습 결과 상세';detailSub.textContent='';detailBody.innerHTML='<div class="empty">상세 결과를 불러오는 중입니다.</div>';overlay.classList.add('open');fetchJsonpObject(url).then(function(r){if(!r||r.error)throw new Error(r&&r.error||'EMPTY_RESPONSE');var a=r.attempt||{},qs=r.question_items||[],ws=r.word_items||[];detailTitle.textContent=a.assignment_title||'학습 결과 상세';detailSub.textContent=[trackText(a.content_type),statusText(a.status),durationText(a.duration_ms)].join(' · ');detailBody.innerHTML='<section class="panel"><h3>문항별 결과</h3>'+qs.map(function(q){var sentence=q.sentence_structure?'<small class="muted">주어 '+(q.sentence_structure.subject_correct?'정답':'오답')+' · 본동사 '+(q.sentence_structure.main_verb_correct?'정답':'오답')+'</small>':'',meta=questionMetaText(q);return'<div class="statline"><span>'+hEsc(q.display||'문항')+(meta?'<small class="muted">'+hEsc(meta)+'</small>':'')+'<small class="muted">학생답 '+hEsc(JSON.stringify(q.student_answer))+' · 정답 '+hEsc(JSON.stringify(q.correct_answer))+'</small>'+sentence+'</span><b>'+(q.grading_status==='PENDING'?'대기':q.is_correct?'정답':'오답')+'</b></div>'}).join('')+ws.map(function(w){return'<div class="statline"><span>'+hEsc(w.term)+' '+hEsc(w.meaning||'')+'</span><b>오답 '+Number(w.wrong_count||0)+'회</b></div>'}).join('')+(!qs.length&&!ws.length?'<div class="empty">저장된 문항 상세가 없습니다.</div>':'')+'</section>'}).catch(function(error){detailBody.innerHTML='<div class="empty error">상세를 불러오지 못했습니다: '+hEsc(error.message)+'</div>'})}
})();
