<style>body{margin:0;background:var(--eb-bg);font-family:Pretendard,sans-serif}.wrap{width:calc(100% - 48px);max-width:1320px;margin:auto;padding:28px 0 60px}.panel{margin-bottom:16px;padding:20px;border:1px solid var(--eb-border);border-radius:var(--eb-panel-radius);background:#fff}.form-grid{display:grid;grid-template-columns:1.3fr .7fr 1.4fr 1.4fr 1.3fr;gap:12px}.field label,.label{display:block;margin:0 0 5px;color:var(--eb-text-muted);font-size:13px;font-weight:750}.field input,.field select{box-sizing:border-box;width:100%;height:42px;padding:8px 10px;border:1px solid var(--eb-border-strong);border-radius:7px;background:#fff;font:inherit}.days{display:grid;grid-template-columns:repeat(7,minmax(30px,1fr));gap:4px}.days label{display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:0;height:36px;padding:0 5px;border:1px solid var(--eb-border-strong);border-radius:7px;background:#fff;color:var(--eb-text-muted);font-size:13px;font-weight:750;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}.days label:hover{border-color:var(--eb-primary-700);color:var(--eb-primary-700)}.days label:has(input:checked){border-color:var(--eb-primary-700);background:var(--eb-primary-700);color:#fff}.days label:focus-within{outline:2px solid color-mix(in srgb,var(--eb-primary-700) 28%,transparent);outline-offset:2px}.days input{position:absolute;width:1px!important;height:1px!important;padding:0!important;border:0!important;opacity:0;pointer-events:none}.members{display:flex;flex-wrap:wrap;gap:6px;max-height:145px;overflow:auto}.members label{display:flex;align-items:center;gap:5px;padding:7px 9px;border:1px solid var(--eb-border);border-radius:7px;font-size:13px}.time-selects{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}.form-grid .time-selects select{box-sizing:border-box;width:100%;height:42px;min-height:42px;padding:8px 7px;border:1px solid var(--eb-border-strong);border-radius:7px;background:#fff;font:inherit}.actions{display:flex;gap:8px;margin-top:14px}.btn{padding:9px 14px;border:0;border-radius:7px;background:var(--eb-primary-700);color:#fff;font-weight:750;cursor:pointer}.btn.sub{background:#edf2f7;color:var(--eb-text)}.btn.danger{background:#fff0f0;color:#d43b3b}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:15px;border:1px solid var(--eb-border);border-radius:10px}.card-top{display:flex;align-items:start;justify-content:space-between;gap:10px}.meta{margin-top:6px;color:var(--eb-text-muted);font-size:13px}.student-row{display:grid;grid-template-columns:minmax(100px,.8fr) 100px 1.4fr 1.4fr 1.3fr auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--eb-border)}.student-row select,.student-row input{box-sizing:border-box;width:100%;height:39px;padding:7px;border:1px solid var(--eb-border-strong);border-radius:6px}.schedule{width:100%;border-collapse:collapse;table-layout:fixed}.schedule th,.schedule td{padding:10px 7px;border:1px solid var(--eb-border);text-align:center;vertical-align:top}.schedule th{background:#f3f6fa}.schedule .time{width:82px;font-weight:800}.slot{margin:2px 0;padding:5px;border-radius:5px;background:#eaf3ff;color:#244f91;font-size:12px;font-weight:700}.slot.one{background:#eef8f2;color:#28724a}@media(max-width:900px){.form-grid,.student-row{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.table-wrap{overflow-x:auto}.schedule{min-width:720px}}@media(max-width:520px){.wrap{width:calc(100% - 28px)}.form-grid,.student-row{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><div data-elab-nav="classes"></div><header class="eb-page-header"><h1>Class</h1></header><section class="panel"><h2>Class 등록</h2><input type="hidden" id="classId"><div class="form-grid"><div class="field"><label>반 이름</label><input id="className" placeholder="예: 고1 월수반"></div><div class="field"><label>학년</label><select id="classGrade"></select></div><div><span class="label">수업요일</span><div class="days" id="classDays"></div></div><div><span class="label">수업시간</span><div class="time-selects" id="classTime"></div></div><div class="field"><label>메모</label><input id="classMemo" placeholder="선택"></div></div><div class="label" style="margin-top:14px">학생</div><div id="classMembers" class="members"></div><div class="actions"><button id="saveClass" class="btn">Class 저장</button><button id="cancelEdit" class="btn sub" type="button">입력 초기화</button></div><p id="classStatus"></p></section><section class="panel"><h2>Class 목록</h2><div id="classList" class="cards"></div></section><section class="panel"><h2>1:1 학생 수업등록</h2><div id="individualList"></div></section><section class="panel"><h2>주간 시간표</h2><div class="table-wrap"><table class="schedule"><thead><tr><th class="time">시간</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th></tr></thead><tbody id="scheduleBody"></tbody></table></div></section></main>
<script>(function(){'use strict';var DAYS=['월','화','수','목','금','토','일'],GRADES=['','초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3','기타'],DATA_CACHE_KEY='elab.classes.data.cache.v1',state={students:[],groups:[]},classId=document.getElementById('classId'),className=document.getElementById('className'),classGrade=document.getElementById('classGrade'),classDays=document.getElementById('classDays'),classTime=document.getElementById('classTime'),classMemo=document.getElementById('classMemo'),classMembers=document.getElementById('classMembers'),saveClass=document.getElementById('saveClass'),cancelEdit=document.getElementById('cancelEdit'),classStatus=document.getElementById('classStatus'),classList=document.getElementById('classList'),individualList=document.getElementById('individualList'),scheduleBody=document.getElementById('scheduleBody');function cfg(){try{return JSON.parse(localStorage.getItem('hub.delivery'))||{}}catch(e){return{}}}function cacheState(){try{localStorage.setItem(DATA_CACHE_KEY,JSON.stringify({students:state.students,groups:state.groups,at:Date.now()}))}catch(e){}}function restoreState(){try{var saved=JSON.parse(localStorage.getItem(DATA_CACHE_KEY)||'null');if(!saved||!Array.isArray(saved.students)||!Array.isArray(saved.groups))return false;state.students=saved.students;state.groups=saved.groups;return true}catch(e){return false}}function uid(){if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID();return'D'+Date.now().toString(36)+Math.random().toString(36).slice(2,12)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function jsonp(url){return ELABAppsScript.read(url,{timeoutMs:30000}).catch(function(error){console.error('[ELAB class read]',{code:error.code||'NETWORK_ERROR',message:error.message||String(error)});return null})}function send(body){var c=cfg(),text=JSON.stringify(Object.assign({token:c.token},body));if(navigator.sendBeacon&&navigator.sendBeacon(c.url,new Blob([text],{type:'text/plain;charset=utf-8'})))return Promise.resolve();return fetch(c.url,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:text})}function gradeOptions(value){return GRADES.map(function(g){return'<option value="'+g+'" '+(g===String(value||'')?'selected':'')+'>'+(g||'선택')+'</option>'}).join('')}function dayChecks(value,name){var set=new Set(String(value||'').split(',').filter(Boolean));return DAYS.map(function(d){return'<label><input type="checkbox" name="'+name+'" value="'+d+'" '+(set.has(d)?'checked':'')+'>'+d+'</label>'}).join('')}function timeParts(value){var h=Number(String(value||'').split(':')[0])||0,m=Number(String(value||'').split(':')[1])||0;return{ap:h>=12?'PM':'AM',h:h?((h+11)%12)+1:1,m:Math.floor(m/10)*10}}function timeSelects(value,prefix){var p=timeParts(value),hours=Array.from({length:12},function(_,i){return i+1}),mins=[0,10,20,30,40,50];return'<select data-'+prefix+'-ap><option value="AM" '+(p.ap==='AM'?'selected':'')+'>오전</option><option value="PM" '+(p.ap==='PM'?'selected':'')+'>오후</option></select><select data-'+prefix+'-h>'+hours.map(function(h){var s=String(h).padStart(2,'0');return'<option value="'+h+'" '+(p.h===h?'selected':'')+'>'+s+'시</option>'}).join('')+'</select><select data-'+prefix+'-m>'+mins.map(function(m){var s=String(m).padStart(2,'0');return'<option value="'+m+'" '+(p.m===m?'selected':'')+'>'+s+'분</option>'}).join('')+'</select>'}function readTime(root,prefix){var ap=root.querySelector('[data-'+prefix+'-ap]').value,h=Number(root.querySelector('[data-'+prefix+'-h]').value),m=Number(root.querySelector('[data-'+prefix+'-m]').value);if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}function showTime(value){if(!value)return'시간 미등록';var p=timeParts(value);return(p.ap==='AM'?'오전 ':'오후 ')+String(p.h).padStart(2,'0')+':'+String(p.m).padStart(2,'0')}function reset(){classId.value='';className.value='';classGrade.innerHTML=gradeOptions('');classDays.innerHTML=dayChecks('','class-day');classTime.innerHTML=timeSelects('','class');classMemo.value='';classMembers.querySelectorAll('input').forEach(function(x){x.checked=false})}
function render(){classMembers.innerHTML=state.students.filter(function(s){return s.active!==false}).map(function(s){return'<label><input type="checkbox" value="'+esc(s.student_id)+'">'+esc(s.name)+'</label>'}).join('')||'학생 없음';classList.innerHTML=state.groups.map(function(g){var studentIds=Array.isArray(g.student_ids)?g.student_ids:[];return'<article class="card" style="opacity:'+(g.active?1:.55)+'"><div class="card-top"><div><b>'+esc(g.name)+'</b><div class="meta">'+esc([g.grade,g.lesson_days,showTime(g.lesson_time)].filter(Boolean).join(' · '))+'</div><div class="meta">학생 '+studentIds.length+'명'+(g.memo?' · '+esc(g.memo):'')+'</div></div><div><button class="btn sub" data-edit="'+g.group_id+'">수정</button> <button class="btn danger" data-toggle="'+g.group_id+'">'+(g.active?'종료':'재개')+'</button></div></div></article>'}).join('')||'등록된 Class가 없습니다.';classList.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){editClass(b.dataset.edit)}});classList.querySelectorAll('[data-toggle]').forEach(function(b){b.onclick=function(){toggleClass(b.dataset.toggle)}});renderIndividuals();renderSchedule()}function editClass(id){var g=state.groups.find(function(x){return String(x.group_id)===String(id)});if(!g)return;classId.value=g.group_id;className.value=g.name;classGrade.innerHTML=gradeOptions(g.grade);classDays.innerHTML=dayChecks(g.lesson_days,'class-day');classTime.innerHTML=timeSelects(g.lesson_time,'class');classMemo.value=g.memo||'';var set=new Set((Array.isArray(g.student_ids)?g.student_ids:[]).map(String));classMembers.querySelectorAll('input').forEach(function(x){x.checked=set.has(x.value)});window.scrollTo({top:0,behavior:'smooth'});classStatus.textContent=g.name+' 수정 중'}function toggleClass(id){var g=state.groups.find(function(x){return String(x.group_id)===String(id)});if(!g)return;g.active=!g.active;cacheState();render();send({action:'saveGroupV2',group_id:id,active:g.active});classStatus.textContent=g.active?'Class를 재개했습니다.':'Class를 종료했습니다.'}
function renderIndividuals(){individualList.innerHTML=state.students.filter(function(s){return s.active!==false}).map(function(s){return'<div class="student-row" data-student="'+s.student_id+'"><b>'+esc(s.name)+'</b><select data-grade>'+gradeOptions(s.grade)+'</select><div class="days" data-days>'+dayChecks(s.lesson_days,'student-'+s.student_id)+'</div><div class="time-selects" data-time>'+timeSelects(s.lesson_time,'student')+'</div><input data-memo value="'+esc(s.lesson_memo||'')+'" placeholder="수업 메모"><button class="btn" data-save>저장</button></div>'}).join('')||'수강 중인 학생이 없습니다.';individualList.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){saveStudent(b.closest('[data-student]'))}})}function saveStudent(row){var s=state.students.find(function(x){return String(x.student_id)===row.dataset.student}),days=Array.from(row.querySelectorAll('[data-days] input:checked')).map(function(x){return x.value}).join(',');s.grade=row.querySelector('[data-grade]').value;s.lesson_days=days;s.lesson_time=readTime(row.querySelector('[data-time]'),'student');s.lesson_memo=row.querySelector('[data-memo]').value.trim();cacheState();send({action:'saveStudent',request_id:uid(),student_id:s.student_id,name:s.name,grade:s.grade,lesson_days:s.lesson_days,lesson_time:s.lesson_time,lesson_memo:s.lesson_memo});var b=row.querySelector('[data-save]');b.textContent='저장됨';b.disabled=true;setTimeout(function(){b.textContent='저장';b.disabled=false},700);renderSchedule()}
function renderSchedule(){var entries=[];state.groups.filter(function(g){return g.active&&g.lesson_days&&g.lesson_time}).forEach(function(g){String(g.lesson_days).split(',').forEach(function(d){entries.push({day:d,time:g.lesson_time,name:g.name,one:false})})});state.students.filter(function(s){return s.active!==false&&s.lesson_days&&s.lesson_time}).forEach(function(s){String(s.lesson_days).split(',').forEach(function(d){entries.push({day:d,time:s.lesson_time,name:s.name,one:true})})});var times=Array.from(new Set(entries.map(function(x){return x.time}))).sort();scheduleBody.innerHTML=times.map(function(time){return'<tr><td class="time">'+showTime(time)+'</td>'+DAYS.map(function(day){return'<td>'+entries.filter(function(x){return x.time===time&&x.day===day}).map(function(x){return'<div class="slot '+(x.one?'one':'')+'">'+esc(x.name)+'</div>'}).join('')+'</td>'}).join('')+'</tr>'}).join('')||'<tr><td colspan="8">등록된 수업시간이 없습니다.</td></tr>'}
saveClass.onclick=function(){try{if(!className.value.trim()){classStatus.textContent='반 이름을 입력하세요.';return}var id=classId.value||uid(),studentIds=Array.from(classMembers.querySelectorAll('input:checked')).map(function(x){return x.value}),g={group_id:id,name:className.value.trim(),grade:classGrade.value,lesson_days:Array.from(classDays.querySelectorAll('input:checked')).map(function(x){return x.value}).join(','),lesson_time:readTime(classTime,'class'),memo:classMemo.value.trim(),active:true,student_ids:studentIds},idx=state.groups.findIndex(function(x){return String(x.group_id)===String(id)});if(idx<0)state.groups.push(g);else state.groups[idx]=g;cacheState();send(Object.assign({action:'saveGroupV2'},g));send({action:'setGroupMembersV2',group_id:id,student_ids:studentIds});classStatus.textContent='저장했습니다.';render();reset()}catch(err){classStatus.textContent='저장하지 못했습니다. 다시 시도해주세요.'}};cancelEdit.onclick=reset;async function load(){var hadCache=restoreState();if(hadCache){render();reset()}var c=cfg();if(!c.url||!c.token){classStatus.textContent='환경설정에서 연결 정보를 확인하세요.';return}var base=c.url+'?token='+encodeURIComponent(c.token),r=await Promise.all([jsonp(base+'&action=listStudents'),jsonp(base+'&action=listGroupsV2')]);if(!r[0]||!r[1]||r[0].error||r[1].error){if(!hadCache)classStatus.textContent='데이터를 불러오지 못했습니다.';return}state.students=r[0].students||[];state.groups=r[1].groups||[];cacheState();classStatus.textContent='';render();reset()}reset();load()})();</script></body></html>
