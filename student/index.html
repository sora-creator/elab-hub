<body><main class="student-shell">
<header class="student-top"><a class="student-logo" href="./index.html"><img src="../shared/assets/ELAB_logo.svg" alt="ELAB"></a><div id="studentAccount" class="student-account hidden"><span id="accountName"></span><button id="logout" class="text-btn" type="button">로그아웃</button></div></header>
<section id="gateView" class="gate"><h1>내 과제 확인</h1><p>선생님께 등록한 이름과 PIN을 입력하세요.</p><div class="field"><label for="inName">이름</label><input id="inName" autocomplete="username"></div><div class="field"><label for="inPin">PIN</label><input id="inPin" type="password" inputmode="numeric" autocomplete="current-password"></div><button id="btnGo" class="primary" type="button">과제 확인</button><div id="gateStatus" class="status" role="status"></div></section>
<section id="myView" class="home hidden"><div class="home-head"><h1><span id="myName"></span>님의 과제</h1></div><div class="summary"><div class="metric"><span>진행할 과제</span><b id="activeCount">0</b></div><div class="metric"><span>완료</span><b id="doneCount">0</b></div><div class="metric"><span>기한초과</span><b id="overdueCount">0</b></div></div><div class="tabs" role="tablist"><button class="tab active" data-view="active" type="button">진행 중</button><button class="tab" data-view="done" type="button">완료</button></div><div id="assignmentStatus" class="load-state">과제를 불러오는 중입니다.</div><div id="assignmentList" class="assignment-list"></div>
<section id="legacyAssignments" class="legacy hidden"><h2>기존 과제</h2><div class="legacy-grid"><div class="legacy-card"><b>단어암기</b><div id="vocabBody"></div></div><div class="legacy-card"><b>개별문제</b><div id="examBody"></div></div><div class="legacy-card"><b>문법학습</b><div id="grammarBody"></div></div><div class="legacy-card"><b>구분문제</b><div id="finalQuizBody"></div></div></div></section><a id="reviewLink" class="review" href="#">오답노트 보기 →</a></section>
</main><script>
(function(){'use strict';var DEFAULT_HOOK=String(window.ELAB_AUTH_CONFIG&&window.ELAB_AUTH_CONFIG.endpoint||''),SESSION_KEY='elab.student.portal.session.v2',CACHE_PREFIX='elab.student.assignments.v2.',params=new URLSearchParams(location.search),hook=params.get('hook')||DEFAULT_HOOK,currentLogin=null,currentItems=[],currentView='active',gateView=document.getElementById('gateView'),myView=document.getElementById('myView'),gateStatus=document.getElementById('gateStatus'),btnGo=document.getElementById('btnGo'),assignmentList=document.getElementById('assignmentList'),assignmentStatus=document.getElementById('assignmentStatus');console.info('[ELAB delivery]',{page:'student',source_key:params.get('hook')?'query.hook':'DEFAULT_HOOK',url:hook,default_url:DEFAULT_HOOK});
function uid(n){var chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',out='';for(var i=0;i<(n||10);i++)out+=chars[Math.floor(Math.random()*chars.length)];return out}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function jsonp(url,timeout){return ELABAppsScript.read(url,{timeoutMs:timeout||30000}).catch(function(error){console.error('[ELAB student read]',{code:error.code||'NETWORK_ERROR',message:error.message||String(error)});return{error:error.code||'NETWORK_ERROR'}})}function post(body){var text=JSON.stringify(body);if(navigator.sendBeacon&&navigator.sendBeacon(hook,new Blob([text],{type:'text/plain;charset=utf-8'})))return Promise.resolve();return fetch(hook,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:text})}
function typeLabel(type){return{VOCAB:'단어암기',GRAMMAR:'문법학습',SENTENCE_STRUCTURE:'문장구조 연습',READING:'독해·개별문제',PRACTICE_EXAM:'실전연습'}[type]||type}function stateLabel(status){return{NOT_STARTED:'미시작',IN_PROGRESS:'진행 중',COMPLETED:'완료',OVERDUE:'기한초과',CANCELLED:'취소'}[status]||status}function dateText(value){if(!value)return'마감 없음';var d=new Date(value);if(isNaN(d.getTime()))return'마감 없음';var today=new Date();today.setHours(0,0,0,0);var target=new Date(d);target.setHours(0,0,0,0);var diff=Math.round((target-today)/86400000);if(diff===0)return'오늘 마감';if(diff===1)return'내일 마감';if(diff>1)return(d.getMonth()+1)+'월 '+d.getDate()+'일까지';return'마감일 지남'}function lessonKey(item){var value=item.lesson_date||item.assigned_at,d=new Date(value);if(isNaN(d.getTime()))return'날짜 미등록';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function lessonLabel(key){if(key==='날짜 미등록')return key;var p=key.split('-');return Number(p[1])+'월 '+Number(p[2])+'일 수업 과제'}function cardLink(label,link){if(!link)return'<span class="assignment-meta">배정 없음</span>';return'<span>'+esc(label||'과제')+'</span><br><a href="'+esc(link)+'">시작하기 →</a>'}
function capabilityExpiry(capability){try{var part=String(capability||'').split('.')[0].replace(/-/g,'+').replace(/_/g,'/');while(part.length%4)part+='=';return Number(JSON.parse(atob(part)).exp)||0}catch(e){return 0}}function saveSession(login){try{var capabilityExpires=capabilityExpiry(login&&login.assignmentCapability),localExpires=Date.now()+7*60*60*1000;localStorage.setItem(SESSION_KEY,JSON.stringify({login:login,expiresAt:capabilityExpires?Math.min(localExpires,capabilityExpires):localExpires}))}catch(e){}}function restoreSession(){try{var saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'),capabilityExpires=capabilityExpiry(saved&&saved.login&&saved.login.assignmentCapability);if(saved&&saved.expiresAt>Date.now()&&(!capabilityExpires||capabilityExpires>Date.now())&&saved.login&&saved.login.assignmentCapability)return saved.login;localStorage.removeItem(SESSION_KEY);return null}catch(e){return null}}function saveCache(id,items){try{localStorage.setItem(CACHE_PREFIX+id,JSON.stringify(items))}catch(e){}}function restoreCache(id){try{var items=JSON.parse(localStorage.getItem(CACHE_PREFIX+id)||'[]');return Array.isArray(items)?items:[]}catch(e){return[]}}
function normalizeContentLink(link){var url=new URL(link,location.href),web=/^https?:$/.test(location.protocol);if(!web||url.protocol!=='file:')return url.href;var match=url.pathname.match(/\/(vocab|exam|grammar|practice|wrongnote|student|teacher|sentence-structure)\/index\.html$/i);if(!match)return url.href;var normalized=new URL(match[0],location.origin);normalized.search=url.search;normalized.hash=url.hash;return normalized.href}function appendContext(link,item){var url=new URL(normalizeContentLink(link),location.href);url.searchParams.set('assignment_id',item.assignment_id);url.searchParams.set('assignment_target_id',item.assignment_target_id);url.searchParams.set('student_id',item.student_id);if(item.student_name)url.searchParams.set('student_name',item.student_name);url.searchParams.set('assignmentCapability',item.launch_capability);return url.href}function startAssignment(item,button){button.disabled=true;button.textContent='이동 중';try{post({action:'startAttemptV2',assignment_target_id:item.assignment_target_id,student_id:item.student_id,request_id:'start-'+item.assignment_target_id,studentCapability:item.launch_capability}).catch(function(error){console.warn('[ELAB start attempt]',{message:error&&error.message||String(error)})})}catch(error){console.warn('[ELAB start attempt]',{message:error&&error.message||String(error)})}location.href=appendContext(item.content_link,item)}function filteredItems(){return currentItems.filter(function(item){var done=item.status==='COMPLETED'||item.status==='CANCELLED';return currentView==='done'?done:!done})}function logUnavailableAssignments(){currentItems.filter(function(item){return item.content_available===false}).forEach(function(item){console.warn('[ELAB assignment unavailable]',{reason:item.unavailable_reason||'INVALID_CONTENT_REF',assignment_id:item.assignment_id,assignment_target_id:item.assignment_target_id,content_type:item.content_type,content_ref_id:item.content_ref_id,has_content_link:!!item.content_link})})}
function render(){var active=currentItems.filter(function(x){return x.status!=='COMPLETED'&&x.status!=='CANCELLED'}),done=currentItems.filter(function(x){return x.status==='COMPLETED'}),overdue=currentItems.filter(function(x){return x.status==='OVERDUE'});document.getElementById('activeCount').textContent=active.length;document.getElementById('doneCount').textContent=done.length;document.getElementById('overdueCount').textContent=overdue.length;var list=filteredItems(),allDates=currentItems.map(lessonKey).sort().reverse(),latestDate=allDates[0]||'',groups={};list.forEach(function(item){var key=lessonKey(item);(groups[key]||(groups[key]=[])).push(item)});var dates=Object.keys(groups).sort().reverse();assignmentList.innerHTML=dates.map(function(key){var items=groups[key],latest=key===latestDate,needed=items.filter(function(item){return !latest&&(item.status==='NOT_STARTED'||item.status==='OVERDUE')}).length;return'<section class="lesson-group '+(latest?'latest':'')+'"><div class="lesson-head"><strong>'+esc(lessonLabel(key))+(latest?' · 최근':'')+'</strong>'+(needed?'<span class="lesson-note">진행 필요 '+needed+'개</span>':'')+'</div><div class="lesson-items">'+items.map(function(item){var index=list.indexOf(item),unavailable=item.content_available===false,isDone=item.status==='COMPLETED'||item.status==='CANCELLED',over=item.status==='OVERDUE',needs=!latest&&(item.status==='NOT_STARTED'||over);return'<article class="assignment '+(isDone?'done ':'')+(needs?'needs-action':'')+'"><div><div class="assignment-top"><span class="kind">'+esc(typeLabel(item.content_type))+'</span><span class="state-badge '+(needs?'needed':(over?'overdue':''))+'">'+esc(needs?'진행 필요':stateLabel(item.status))+'</span></div><h2>'+esc(item.title||'과제')+'</h2><div class="assignment-meta">'+esc(dateText(item.due_at))+(unavailable?' · 사용할 수 없는 과제':'')+'</div></div>'+(!isDone?'<button class="assignment-action" data-index="'+index+'" '+(unavailable?'disabled':'')+'>'+(item.status==='IN_PROGRESS'?'이어하기':'시작하기')+'</button>':'')+'</article>'}).join('')+'</div></section>'}).join('')||'<div class="empty">'+(currentView==='done'?'완료한 과제가 없습니다.':'진행할 과제가 없습니다.')+'</div>';Array.prototype.forEach.call(assignmentList.querySelectorAll('[data-index]'),function(button){button.onclick=function(){startAssignment(list[Number(button.dataset.index)],button)}})}
var renderAssignmentsBase=render;render=function(){logUnavailableAssignments();return renderAssignmentsBase()};
function renderLegacy(login){document.getElementById('vocabBody').innerHTML=cardLink(login.vocabLabel,login.vocabLink);document.getElementById('examBody').innerHTML=cardLink(login.examLabel,login.examLink);document.getElementById('grammarBody').innerHTML=cardLink(login.grammarLabel,login.grammarLink);document.getElementById('finalQuizBody').innerHTML=cardLink(login.finalQuizLabel,login.finalQuizLink)}function showHome(login){currentLogin=login;gateView.classList.add('hidden');myView.classList.remove('hidden');document.getElementById('studentAccount').classList.remove('hidden');document.getElementById('accountName').textContent=login.name;document.getElementById('myName').textContent=login.name;renderLegacy(login);var review=new URL('../wrongnote/index.html',location.href);review.searchParams.set('hook',hook);review.searchParams.set('student_id',login.student_id);review.searchParams.set('assignmentCapability',login.assignmentCapability);document.getElementById('reviewLink').href=review.href;if(Array.isArray(login.assignments)){currentItems=login.assignments;saveCache(login.student_id,currentItems);assignmentStatus.textContent='';document.getElementById('legacyAssignments').classList.toggle('hidden',currentItems.length>0);render()}else{currentItems=restoreCache(login.student_id);if(currentItems.length){assignmentStatus.textContent='';render()}loadAssignments(login)}}
async function loadAssignments(login){var traceId=uid(12),started=performance.now(),prefix='[ELAB-STUDENT-READ][trace='+traceId+']',lastStage='READ_START';function trace(stage,detail){lastStage=stage;console.info(prefix+' '+stage+' '+JSON.stringify(Object.assign({elapsed_ms:Math.round(performance.now()-started),action:'listMyAssignmentsV2'},detail||{})))}if(!currentItems.length)assignmentStatus.textContent='과제를 불러오는 중입니다.';trace('READ_START');var response,readError=null;try{response=await ELABAppsScript.read(hook+'?action=listMyAssignmentsV2&student_id='+encodeURIComponent(login.student_id)+'&assignmentCapability='+encodeURIComponent(login.assignmentCapability),{timeoutMs:30000,onTrace:function(stage,detail){trace(stage,detail)}})}catch(error){readError=error;lastStage='READ_ERROR';console.error(prefix+' READ_ERROR '+JSON.stringify({elapsed_ms:Math.round(performance.now()-started),action:'listMyAssignmentsV2',name:error&&error.name||'',message:error&&error.message||String(error),code:error&&error.code||'NETWORK_ERROR',status:error&&error.status||null,last_stage:lastStage}));response={error:error&&error.code||'NETWORK_ERROR'}}finally{console.info(prefix+' FINALLY '+JSON.stringify({elapsed_ms:Math.round(performance.now()-started),action:'listMyAssignmentsV2',final_stage:lastStage}))}if(!response||response.error){if(readError&&readError.code==='AUTH_ERROR'){localStorage.removeItem(SESSION_KEY);currentLogin=null;myView.classList.add('hidden');gateView.classList.remove('hidden');document.getElementById('studentAccount').classList.add('hidden');gateStatus.textContent='로그인이 만료되었습니다. 이름과 PIN으로 다시 로그인해주세요.';document.getElementById('inName').value=login.name||'';document.getElementById('inPin').value='';document.getElementById('inPin').focus();console.warn(prefix+' SERVER_FAILURE_AUTH_RELOGIN');return}assignmentStatus.textContent=currentItems.length?'최신 과제목록을 불러오지 못했습니다. 저장된 이전 목록을 표시합니다.':'과제를 불러오지 못했습니다. 다시 접속해주세요.';console.warn(prefix+' SERVER_FAILURE_USING_CACHE '+JSON.st function normalizeLoginName(value){value=String(value||'');try{value=value.normalize('NFC')}catch(e){}return value.trim().replace(/\s+/g,' ')}
async function login(){var name=normalizeLoginName(document.getElementById('inName').value),pin=String(document.getElementById('inPin').value||'').trim();if(!name||!pin){gateStatus.textContent='이름과 PIN을 모두 입력하세요.';return}gateStatus.textContent='';btnGo.disabled=true;btnGo.textContent='확인 중';var response=await jsonp(hook+'?action=fetchAssignment&include_assignments=1&name='+encodeURIComponent(name)+'&pin='+encodeURIComponent(pin));btnGo.disabled=false;btnGo.textContent='과제 확인';if(!response||!response.found){console.warn('[ELAB student login]',{received:!!response,found:!!(response&&response.found),reason:response&&response.reason||'',inactive:!!(response&&response.inactive),ambiguous:!!(response&&response.ambiguous)});gateStatus.textContent=response&&response.inactive?'수강이 종료된 계정입니다. 선생님께 문의해주세요.':response&&response.ambiguous?'동일한 로그인 정보가 중복되어 있습니다. 선생님께 문의해주세요.':'이름 또는 PIN을 확인해주세요.';return}saveSession(response);history.replaceState(null,'',location.pathname+(params.get('hook')?'?hook='+encodeURIComponent(hook):''));showHome(response)}

btnGo.onclick=login;document.getElementById('inName').onkeydown=function(e){if(e.key==='Enter')document.getElementById('inPin').focus()};document.getElementById('inPin').onkeydown=function(e){if(e.key==='Enter')login()};document.getElementById('logout').onclick=logout;Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(tab){tab.onclick=function(){currentView=tab.dataset.view;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===tab)});render()}});var restored=restoreSession();if(restored){showHome(restored);if(Array.isArray(restored.assignments))loadAssignments(restored)}else{var presetName=params.get('name'),presetPin=params.get('pin');if(presetName&&presetPin){document.getElementById('inName').value=presetName;document.getElementById('inPin').value=presetPin;login()}}
})();
