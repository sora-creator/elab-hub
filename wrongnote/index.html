</style></head><body><main class="page"><div data-elab-nav="wrongnote"></div><header class="head"><h1>오답노트</h1><p>학생이 틀렸거나 반복해서 어려워한 학습 항목을 확인합니다.</p></header><section class="panel"><div class="toolbar"><select id="student"><option value="">학생 선택</option></select><span id="status" class="meta"></span></div><div id="tracks" class="tracks" hidden></div><div id="content" class="content"><div class="state">학생을 선택하세요.</div></div></section></main><div id="overlay" class="overlay"><aside class="drawer"><header class="drawer-head"><div><h2 id="drawerTitle">오답 이력</h2><div id="drawerSub" class="meta"></div></div><button id="close" class="close">닫기</button></header><div id="drawerBody" class="drawer-body"></div></aside></div><script src="../shared/nav.js?v=assignment-flow-20260830-4"></script><script src="../shared/appsScriptTransport.js?v=read-404-retry-1"></script><script>
(function(){'use strict';var p=new URLSearchParams(location.search),sid=p.get('student_id')||p.get('student')||'',cap=p.get('assignmentCapability')||'',hook=p.get('hook')||'',studentMode=!!(sid&&cap),token='',track='',groupKey='',groups=[],items=[],groupCursor=null,itemCursor=null,defs=[['VOCAB','단어'],['SENTENCE_STRUCTURE','문장구조'],['GRAMMAR','문법'],['READING','독해'],['PRACTICE_EXAM','실전연습']],student=document.getElementById('student'),tracks=document.getElementById('tracks'),content=document.getElementById('content'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay'),drawerTitle=document.getElementById('drawerTitle'),drawerSub=document.getElementById('drawerSub'),drawerBody=document.getElementById('drawerBody');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function day(v){if(!v)return'—';var d=new Date(v);return isNaN(d)?'—':d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()}function name(k){var d=defs.filter(function(x){return x[0]===k})[0];return d?d[1]:k}function cfg(){for(var keys=['hub.delivery','mockexam.delivery','grammarhub.delivery','vpang.delivery'],i=0;i<keys.length;i++)try{var x=JSON.parse(localStorage.getItem(keys[i])||'null');if(x&&x.url&&x.token)return x}catch(e){}return{}}function auth(){return studentMode?'&assignmentCapability='+encodeURIComponent(cap):'&token='+encodeURIComponent(token)}function req(action,q){var cb='__wn'+Math.random().toString(36).slice(2),url=hook+'?action='+action+'&student_id='+encodeURIComponent(sid)+auth()+(q||'')+'&callback='+cb;return ELABAppsScript.read(url,{callback:cb})}function retryUrl(r){var u=new URL('../exam/index.html',location.href);u.searchParams.set('study',r.set_key);u.searchParams.set('hook',hook);u.searchParams.set('student_id',sid);u.searchParams.set('assignment_target_id',r.assignment_target_id);u.searchParams.set('assignmentCapability',r.assignmentCapability);u.searchParams.set('review_request_id',r.review_request_id);return u.href}function state(t){content.innerHTML='<div class="state">'+esc(t)+'</div>'}function sync(){var n=document.querySelector('.eb-topbar'),b=n?Math.max(0,n.getBoundingClientRect().bottom):0;document.documentElement.style.setProperty('--elab-header-bottom',b+'px')}function open(){sync();overlay.classList.add('open');document.body.style.overflow='hidden'}function close(){overlay.classList.remove('open');document.body.style.overflow=''}
function renderTracks(rows){var by={};(rows||[]).forEach(function(x){by[x.track]=x});tracks.hidden=false;tracks.innerHTML=defs.map(function(d){var x=by[d[0]]||{};return'<button class="track '+(track===d[0]?'active':'')+'" data-track="'+d[0]+'"><b>'+d[1]+'</b><span>오답 '+Number(x.item_count||0)+'개<br>반복오답 '+Number(x.repeated_count||0)+'개<br>최근 '+day(x.last_wrong_at)+'</span></button>'}).join('');tracks.querySelectorAll('[data-track]').forEach(function(b){b.onclick=function(){loadGroups(b.dataset.track,true)}})}
function renderGroups(){content.innerHTML='<button class="back" id="toSummary">Track 요약</button><h2>'+name(track)+' 학습 묶음</h2>'+(groups.length?groups.map(function(g){return'<button class="group" data-group="'+esc(g.group_key)+'"><span><span class="title">'+esc(g.title)+'</span><span class="meta">최근 '+day(g.last_study_at)+(g.lesson_date?' · 수업일 '+day(g.lesson_date):'')+'</span></span><span class="meta">오답 '+g.item_count+'개<br>반복 '+g.repeated_count+'개</span></button>'}).join(''):'<div class="state">이 영역의 오답 기록이 없습니다.</div>')+(groupCursor!=null?'<button class="more" id="moreGroups">더 보기</button>':'');document.getElementById('toSummary').onclick=loadSummary;content.querySelectorAll('[data-group]').forEach(function(b){b.onclick=function(){loadItems(b.dataset.group,true)}});var m=document.getElementById('moreGroups');if(m)m.onclick=function(){loadGroups(track,false)}}
function renderItems(){content.innerHTML='<button class="back" id="toGroups">학습 묶음 목록</button><h2>오답 항목</h2>'+(items.length?items.map(function(x,i){var sub=x.subskill_key==='SUBJECT'?' · 주어':x.subskill_key==='MAIN_VERB'?' · 본동사':'';return'<div class="item-row"><button class="item" data-item="'+esc(x.review_item_id)+'"><span><span class="title">'+esc(x.display)+sub+'</span>'+(x.meaning?'<span class="meta">'+esc(x.meaning)+'</span>':'')+'<span class="meta">최근 오답 '+day(x.last_wrong_at)+'</span></span><span class="count">누적 오답 '+Number(x.wrong_count||0)+'회</span></button>'+(x.retry?'<button class="retry" data-retry="'+i+'">다시 풀기</button>':'')+'</div>'}).join(''):'<div class="state">저장된 오답 항목이 없습니다.</div>')+(itemCursor!=null?'<button class="more" id="moreItems">더 보기</button>':'');document.getElementById('toGroups').onclick=renderGroups;content.querySelectorAll('[data-item]').forEach(function(b){b.onclick=function(){var id=b.dataset.item,item=items.filter(function(x){return String(x.review_item_id)===String(id)})[0];openItemHistory(item||{review_item_id:id})}});content.querySelectorAll('[data-retry]').forEach(function(b){b.onclick=function(){location.href=retryUrl(items[Number(b.dataset.retry)].retry)}});var m=document.getElementById('moreItems');if(m)m.onclick=function(){loadItems(groupKey,false)}}
function loadSummary(){track='';state('Track 요약을 불러오는 중입니다.');req('getWrongnoteSummaryV2','').then(function(r){renderTracks(r.tracks);content.innerHTML='<div class="state">영역을 선택하면 학습 묶음별 오답을 볼 수 있습니다.</div>'}).catch(function(e){state('오답 요약을 불러오지 못했습니다: '+e.message)})}function loadGroups(k,reset){track=k;if(reset){groups=[];groupCursor=null;state('학습 묶음을 불러오는 중입니다.')}req('listWrongnoteGroupsV2','&track='+encodeURIComponent(k)+'&limit=20'+(reset?'':'&cursor='+encodeURIComponent(groupCursor||0))).then(function(r){groups=groups.concat(r.groups||[]);groupCursor=r.next_cursor;renderGroups()}).catch(function(e){state('학습 묶음을 불러오지 못했습니다: '+e.message)})}function loadItems(k,reset){groupKey=k;if(reset){items=[];itemCursor=null;state('오답 항목을 불러오는 중입니다.')}req('listWrongnoteGroupItemsV2','&track='+encodeURIComponent(track)+'&group_key='+encodeURIComponent(k)+'&limit=25'+(reset?'':'&cursor='+encodeURIComponent(itemCursor||0))).then(function(r){items=items.concat(r.items||[]);itemCursor=r.next_cursor;renderItems()}).catch(function(e){state('오답 항목을 불러오지 못했습니다: '+e.message)})}
function loadHistory(id){drawerTitle.textContent='오답 이력';drawerBody.innerHTML='<div class="state">이력을 불러오는 중입니다.</div>';open();req('getReviewItemHistoryV2','&review_item_id='+encodeURIComponent(id)+'&limit=30').then(function(r){var x=r.item||{};drawerTitle.textContent=x.display||'오답 이력';drawerSub.textContent=(x.meaning?x.meaning+' · ':'')+'누적 오답 '+Number(x.wrong_count||0)+'회';drawerBody.innerHTML=(r.events||[]).map(function(e){return'<div class="event"><div class="event-top"><b>'+day(e.created_at)+'</b><b>'+(e.outcome==='WRONG'?'오답':'정답')+'</b></div><div class="meta">'+esc(e.assignment_title||name(e.content_type))+(e.lesson_date?' · 수업일 '+day(e.lesson_date):'')+(e.wrong_delta?' · 오답 +'+e.wrong_delta:'')+'</div>'+(e.attempt_id?'<button class="attempt" data-attempt="'+esc(e.attempt_id)+'">학습 결과 상세 보기</button>':'')+'</div>'}).join('')+(!r.history_complete?'<div class="state">저장된 ReviewEvent 범위만 표시합니다.</div>':'');drawerBody.querySelectorAll('[data-attempt]').forEach(function(b){b.onclick=function(){loadAttempt(b.dataset.attempt)}})}).catch(function(e){drawerBody.innerHTML='<div class="state">'+esc(e.message)+'</div>'})}function loadAttempt(id){drawerBody.innerHTML='<div class="state">학습 결과를 불러오는 중입니다.</div>';req('getAttemptDetailV2','&attempt_id='+encodeURIComponent(id)).then(function(r){var a=r.attempt||{};drawerTitle.textContent=a.assignment_title||'학습 결과 상세';drawerSub.textContent=name(a.content_type)+' · '+day(a.started_at);drawerBody.innerHTML=(r.question_items||[]).map(function(q){var source=q.source||{},meta=[(q.categories||[]).map(function(c){return c.label}).join(', '),[source.year,source.grade,source.month?source.month+'월':'',source.exam_name].filter(Boolean).join(' · '),q.source_question_no?'문항 '+q.source_question_no:'',q.difficulty||'',q.elapsed_ms?Math.round(Number(q.elapsed_ms)/1000)+'초':''].filter(Boolean).join(' · ');return'<div class="detail"><b>'+esc(q.display||'문항')+'</b><div class="meta">'+esc(meta)+'</div><div class="meta">학생답 '+esc(JSON.stringify(q.student_answer))+' · 정답 '+esc(JSON.stringify(q.correct_answer))+' · '+(q.grading_status==='PENDING'?'채점 대기':q.is_correct?'정답':'오답')+'</div></div>'}).join('')+(r.word_items||[]).map(function(w){return'<div class="detail"><b>'+esc(w.term||'단어')+'</b><div class="meta">'+esc(w.meaning||'')+' · 오답 '+Number(w.wrong_count||0)+'회</div></div>'}).join('')}).catch(function(e){drawerBody.innerHTML='<div class="state">'+esc(e.message)+'</div>'})}
function renderHistoryPreview(item,preview){var events=preview.events||[];drawerTitle.textContent=item.display||'오답 이력';drawerSub.textContent=(item.meaning?item.meaning+' · ':'')+'누적 오답 '+Number(item.wrong_count||0)+'회'+(preview.has_more?' · 최근 이력 3개':'');drawerBody.innerHTML=events.map(function(e){return'<div class="event"><div class="event-top"><b>'+day(e.created_at)+'</b><b>'+(e.outcome==='WRONG'?'오답':'정답')+'</b></div><div class="meta">'+esc(e.assignment_title||name(e.content_type))+(e.lesson_date?' · 수업일 '+day(e.lesson_date):'')+(e.wrong_delta?' · 오답 +'+e.wrong_delta:'')+'</div>'+(e.attempt_id?'<button class="attempt" data-attempt="'+esc(e.attempt_id)+'">학습 결과 상세 보기</button>':'')+'</div>'}).join('')+(preview.has_more?'<button class="more" id="fullHistory">전체 이력 보기</button>':'');drawerBody.querySelectorAll('[data-attempt]').forEach(function(b){b.onclick=function(){loadAttempt(b.dataset.attempt)}});var more=document.getElementById('fullHistory');if(more)more.onclick=function(){loadHistory(item.review_item_id)}}
function openItemHistory(item){if(item&&item.history_preview){open();renderHistoryPreview(item,item.history_preview);return}loadHistory(item&&item.review_item_id||'')}
function initTeacher(){var c=cfg();hook=c.url||'';token=c.token||'';if(!hook||!token){state('환경설정에서 서버 주소와 교사용 토큰을 저장하세요.');return}var cb='__roster'+Math.random().toString(36).slice(2);fetch(hook+'?action=listStudents&token='+encodeURIComponent(token)+'&callback='+cb,{mode:'cors',redirect:'follow'}).then(function(r){return r.text()}).then(function(t){t=t.trim();if(t.slice(-1)===';')t=t.slice(0,-1);var a=JSON.parse(t.slice((cb+'(').length,-1));student.innerHTML='<option value="">학생 선택</option>'+(a.students||[]).filter(function(s){return s.active!==false}).map(function(s){return'<option value="'+esc(s.student_id)+'">'+esc(s.name)+'</option>'}).join('');if(sid){student.value=sid;if(student.value)student.onchange()}}).catch(function(){state('학생 목록을 불러오지 못했습니다.')})}student.onchange=function(){sid=student.value;tracks.hidden=true;if(sid)loadSummary();else state('학생을 선택하세요.')};document.getElementById('close').onclick=close;overlay.onclick=function(e){if(e.target===overlay)close()};window.addEventListener('resize',sync,{passive:true});sync();if(studentMode){student.hidden=true;loadSummary()}else initTeacher()})();
