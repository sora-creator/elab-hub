<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELAB · 환경설정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../shared/theme.css?v=elab-restored-1">
<script src="../shared/nav.js?v=assignment-flow-20260830-4"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard",sans-serif;background:var(--eb-bg);color:var(--eb-text)}
.shell{width:calc(100% - 64px);max-width:920px;margin:auto;padding:28px 0 56px}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--eb-border)}.logo{width:128px}.back{color:var(--eb-text-muted);font-size:14px;font-weight:700;text-decoration:none}.header{padding:36px 0 24px}.header h1{margin:0;font-size:30px;letter-spacing:-.04em}.header p{margin:8px 0 0;color:var(--eb-text-muted);font-size:15px}.panel{margin-bottom:16px;padding:24px;border:1px solid var(--eb-border);border-radius:var(--eb-panel-radius);background:#fff}.panel h2{margin:0 0 6px;font-size:18px}.help{margin:0 0 20px;color:var(--eb-text-muted);font-size:14px;line-height:1.6}.grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px}.field label{display:block;margin-bottom:7px;color:var(--eb-text-muted);font-size:13px;font-weight:700}.control{display:flex;gap:8px}.field input{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--eb-border);border-radius:var(--eb-control-radius);background:#fff;font:inherit;outline:none}.field input:focus{border-color:var(--eb-primary-600);box-shadow:0 0 0 3px rgba(14,116,144,.1)}button{flex:0 0 auto;padding:10px 14px;border:0;border-radius:var(--eb-control-radius);background:var(--eb-text);color:#fff;font:inherit;font-weight:700;cursor:pointer}.primary{margin-top:16px;background:var(--eb-primary-600)}.status{margin-left:10px;color:var(--eb-success);font-size:14px}.portal{display:flex;gap:8px}.portal input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--eb-border);border-radius:var(--eb-control-radius);background:var(--eb-surface-subtle);font:inherit;color:var(--eb-text-muted)}.notice{margin-top:12px;color:var(--eb-text-faint);font-size:12px;line-height:1.6}
@media(max-width:680px){.shell{width:calc(100% - 28px);padding-top:18px}.logo{width:112px}.header{padding-top:28px}.header h1{font-size:26px}.grid{grid-template-columns:1fr}.panel{padding:19px}.portal{align-items:stretch;flex-direction:column}.portal button{width:100%}}
</style>
</head>
<body>
<div data-elab-nav="settings"></div>
<main class="shell">
  <div class="header"><h1>환경설정</h1><p>학생 데이터 연결과 학생용 접속 주소를 관리합니다.</p></div>
  <section class="panel">
    <h2>Google Sheets 연결</h2>
    <p class="help">처음 연결하거나 Apps Script 배포 주소가 변경된 경우에만 수정하세요.</p>
    <div class="grid">
      <div class="field"><label for="cfgUrl">웹훅 URL</label><input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="field"><label for="cfgToken">비밀 토큰</label><div class="control"><input id="cfgToken" type="password" autocomplete="off"><button id="toggleToken" type="button">표시</button></div></div>
    </div>
    <button class="primary" id="save" type="button">연결 설정 저장</button><span class="status" id="saveStatus" role="status"></span>
  </section>
  <section class="panel">
    <h2>학생 포털 링크</h2>
    <p class="help">학생에게는 아래 링크 하나만 전달하면 됩니다. 학생은 이름과 PIN으로 접속합니다.</p>
    <div class="portal"><input id="portalUrl" type="text" readonly><button id="copy" type="button">링크 복사</button></div>
    <p class="notice">온라인 배포 전 로컬에서 복사하면 file:// 주소가 만들어집니다. 학생에게 전달할 때는 배포된 사이트에서 복사하세요.</p>
  </section>
</main>
<script>
(function(){
  'use strict';
  var urlInput=document.getElementById('cfgUrl'),tokenInput=document.getElementById('cfgToken'),portal=document.getElementById('portalUrl'),status=document.getElementById('saveStatus');
  function read(){var keys=['hub.delivery','mockexam.delivery','grammarhub.delivery','vpang.delivery'];for(var i=0;i<keys.length;i++){try{var c=JSON.parse(localStorage.getItem(keys[i])||'null');if(c&&c.url)return c}catch(e){}}return{}}
  function portalUrl(){var c=read(),u=new URL('../student/index.html',location.href);if(c.url)u.searchParams.set('hook',c.url);return u.href}
  function refresh(){var c=read();urlInput.value=c.url||'';tokenInput.value=c.token||'';portal.value=portalUrl()}
  function copied(){var original=document.getElementById('copy').textContent;document.getElementById('copy').textContent='복사됨';setTimeout(function(){document.getElementById('copy').textContent=original},1400)}
  document.getElementById('toggleToken').addEventListener('click',function(){var show=tokenInput.type==='password';tokenInput.type=show?'text':'password';this.textContent=show?'숨기기':'표시'});
  document.getElementById('save').addEventListener('click',function(){var value=JSON.stringify({url:urlInput.value.trim(),token:tokenInput.value.trim()});['hub.delivery','mockexam.delivery','grammarhub.delivery','vpang.delivery'].forEach(function(key){localStorage.setItem(key,value)});portal.value=portalUrl();status.textContent='저장했습니다.';setTimeout(function(){status.textContent=''},1800)});
  document.getElementById('copy').addEventListener('click',function(){var text=portal.value;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(copied)}else{portal.select();document.execCommand('copy');copied()}});
  refresh();
})();
</script>
</body>
</html>
